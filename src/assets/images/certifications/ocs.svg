<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="30 0 620 340" width="100%" height="100%">
  <defs>
    <!-- Deep Slate Gradient for Premium Contrast Text/Spine -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Rich Emerald/Teal Gradient for Primary Accents -->
    <linearGradient id="medicalTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

 

  <!-- LOGO ICON (Centered vertically, shifted left of text block) -->
  <g transform="translate(185, 160) scale(0.78)">
    <!-- Outer Premium Shield Layer -->
    <path d="M 0,-160 C 45,-160 115,-140 135,-100 C 145,-40 135,40 0,160 C -135,40 -145,-40 -135,-100 C -115,-140 -45,-160 0,-160 Z" 
          fill="none" stroke="url('#medicalTeal')" stroke-width="4" opacity="0.3" />

    <!-- Inner Sharp Geometric Shield -->
    <path d="M 0,-145 C 35,-145 95,-125 115,-90 C 125,-35 115,35 0,140 C -115,35 -125,-35 -115,-90 C -95,-125 -35,-145 0,-145 Z" 
          fill="none" stroke="url('#slateGrad')" stroke-width="2" opacity="0.15" />

    <!-- Stylized Human Kinetic Arc / Core (Left Side) -->
    <path d="M -45,-105 C -15,-110 -5,-70 -5,-40 C -5,0 -35,20 -40,65 C -42,85 -30,105 -15,115" 
          fill="none" stroke="url('#medicalTeal')" stroke-width="12" stroke-linecap="round" />

    <!-- Stylized Human Kinetic Arc / Core (Right Side) -->
    <path d="M 45,-105 C 15,-110 5,-70 5,-40 C 5,0 35,20 40,65 C 42,85 30,105 15,115" 
          fill="none" stroke="url('#medicalTeal')" stroke-width="12" stroke-linecap="round" />

    <!-- Abstract Vertebrae / Spine Columns -->
    <rect x="-16" y="-85" width="32" height="10" rx="4" fill="url('#slateGrad')" />
    <rect x="-22" y="-67" width="44" height="12" rx="5" fill="url('#slateGrad')" />
    <rect x="-26" y="-47" width="52" height="12" rx="5" fill="url('#slateGrad')" />
    <rect x="-28" y="-27" width="56" height="12" rx="5" fill="url('#slateGrad')" />
    <rect x="-30" y="-7" width="60" height="14" rx="6" fill="url('#slateGrad')" />
    <rect x="-32" y="15" width="64" height="14" rx="6" fill="url('#slateGrad')" />
    <rect x="-34" y="37" width="68" height="14" rx="6" fill="url('#slateGrad')" />

    <!-- Sacred Diamond Intersections -->
    <polygon points="0,-105 8,-113 0,-121 -8,-113" fill="url('#medicalTeal')" />
    <polygon points="0,67 8,59 0,51 -8,59" fill="url('#medicalTeal')" />
    
    <!-- Dynamic Motion Ring -->
    <path d="M -110,-30 C -140,20 -60,110 0,110 C 90,110 130,40 100,-20" 
          fill="none" stroke="url('#medicalTeal')" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
  </g>

  <!-- TYPOGRAPHY SECTION (Centered vertically, perfectly paired with the icon) -->
  <!-- Primary Credential Title -->
  <text x="325" y="120" 
        fill="url('#slateGrad')" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="40px" 
        font-weight="800" 
        letter-spacing="2.5">ORTHOPEDIC</text>

  <!-- Clinical Core Designation -->
  <text x="325" y="162" 
        fill="url('#medicalTeal')" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="30px" 
        font-weight="600" 
        letter-spacing="7">CLINICAL</text>

  <!-- Specialist Designation -->
  <text x="325" y="204" 
        fill="url('#slateGrad')" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="30px" 
        font-weight="400" 
        letter-spacing="5">SPECIALIST</text>

  <!-- Post-Nominal Authority Accent Line -->
  <line x1="327" y1="232" x2="625" y2="232" stroke="url('#medicalTeal')" stroke-width="3.5" stroke-linecap="round" />

  <!-- Board Certified Subtext -->
  <text x="327" y="258" 
        fill="#6B7280" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14px" 
        font-weight="700" 
        letter-spacing="4.5">BOARD CERTIFIED</text>
</svg>