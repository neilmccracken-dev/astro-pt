question: What happens if I need to cancel or reschedule?
answer: >-
  I understand that life happens! If you need to cancel or reschedule, please
  provide at least 24 hours’ notice whenever possible. Appointments canceled
  with less than 24 hours’ notice, as well as missed appointments, may be
  subject to a cancellation fee of $50. I'll do my best to accommodate schedule
  changes when availability allows. Thank you for respecting the time reserved
  for your care!
category: appointments-treatment
