question: Do you offer dry needling?
answer: >-
  Yes! Dry needling may be incorporated into your treatment plan when
  appropriate, based on your symptoms, goals, and individual needs. It can be
  used alongside exercise and other physical therapy techniques to help address
  certain types of muscle pain and movement limitations. Dry needling is always
  an optional part of treatment, and we'll discuss whether it's a good fit for
  you before proceeding.
