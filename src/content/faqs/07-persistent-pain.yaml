question: Persistent Pain
answer: >-
  Pain that sticks around can be frustrating and affect many aspects of daily
  life. As a Therapeutic Pain Specialist (TPS), I take an individualized,
  evidence-informed approach that considers the many factors influencing pain.
  Together, we'll work to improve movement, build strength, and restore
  confidence in your body so you can return to meaningful activities.
category: specialties
order: 2
