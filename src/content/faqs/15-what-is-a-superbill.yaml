question: What is a superbill?
answer: >-
  A superbill is a detailed receipt that includes information about your
  physical therapy services, such as the date of treatment, applicable billing
  codes, and the amount paid. You can submit it to your insurance company to
  request potential out-of-network reimbursement. Reimbursement is not
  guaranteed and depends on your individual plan and benefits. I'm happy to
  provide a superbill and encourage you to contact your insurance company to
  understand your coverage before your first visit.
category: payment-insurance
order: 3
