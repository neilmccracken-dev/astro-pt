question: What types of payment do you accept?
answer: >-
  Payment is due at the time of your appointment. I accept credit cards, debit
  cards, and HSA/FSA cards. Because MVMNT Matters is a cash-pay practice,
  payment is made directly to the practice rather than billed to your insurance
  company. Health Savings Account (HSA) or Flexible Spending Account (FSA) funds
  may be eligible for use for qualifying physical therapy services, depending on
  your plan.
category: payment-insurance
order: 2
