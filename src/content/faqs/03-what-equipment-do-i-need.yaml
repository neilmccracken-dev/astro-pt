question: What equipment do I need?
answer: >-
  Very little! One of the benefits of mobile physical therapy is that we can
  make use of the space and equipment you already have at home. Depending on
  your goals, we may use everyday household items, resistance bands, weights, or
  other simple exercise equipment. I'll bring bands, light weights, and any
  necessary specialized equipment, so there's no need to purchase anything
  before getting started.
