question: Tennis & Racquet Sports
answer: >-
  As a physical therapy contractor with the USTA Pro Circuit, I bring experience
  working in the competitive tennis environment and an understanding of the
  physical demands of the sport. Tennis places unique demands on the shoulder,
  elbow, wrist, and lower body. Treatment focuses on building the strength,
  mobility, and load tolerance needed for serving, groundstrokes, and court
  movement, with a plan tailored to your level of play and goals.
category: can-you-tell-me-more-about-your-specialties?
