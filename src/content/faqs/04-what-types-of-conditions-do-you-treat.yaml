question: What types of conditions do you treat?
answer: >-
  I treat a variety of orthopedic and musculoskeletal conditions, tendon
  injuries, and post-operative conditions. I also work with active individuals
  looking to improve strength, mobility, and performance or return to activities
  such as running, golf, tennis, and barre. Whether you're recovering from an
  injury or working toward a new goal, treatment is tailored to your needs and
  what matters most to you.
