question: What is mobile physical therapy?
answer: >-
  Mobile physical therapy brings personalized, one-on-one physical therapy
  directly to you in the comfort of your own home, office, or gym. Rather than
  traveling to a clinic, we work together in your own environment to help you
  move better, build strength, reduce pain, and get back to the activities you
  love. Each session is tailored to your goals, lifestyle, and individual needs.
category: getting-started
